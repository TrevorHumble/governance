version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions-all:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      prod-deps:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        # No exclude-patterns. Security review runs for a package being added,
        # not for a bump of one already in use (pipeline/steps/09-pr-review.md,
        # "When security review runs"). dependabot-auto-merge.yml merges every
        # Dependabot PR on green, so holding a package's bumps for a person
        # means making that job skip it; listing it here alone does not.
      dev-deps:
        dependency-type: 'development'
