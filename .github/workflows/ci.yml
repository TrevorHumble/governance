name: CI

on:
  push:
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the em-dash gate below diffs against the default
      # branch, which a shallow checkout would not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Tests
        run: npm test
      # Runs only on pull_request/merge_group so a divergent branch's plain-push
      # does not go permanently red. See DESIGN.md "CI gate for added em dashes".
      - name: Em-dash gate
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: node scripts/check-emdash.js
